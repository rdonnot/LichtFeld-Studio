[project]
name = "lfs-hdr-tools"
version = "0.1.0"
description = "HDR fork tooling: evaluation metrics, synthetic bracket data, dataset checks (not the app's embedded Python)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "openexr>=3.3",
    "pillow>=10.0",
    "pycolmap>=3.11",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["eval", "synth"]
python_files = ["test_*.py"]
markers = [
    "ldr_reference: needs the built binary and the frozen LDR reference run (out/baseline_a); skipped otherwise",
]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]
